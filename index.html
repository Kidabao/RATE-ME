<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HLB Forex Converter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
      color: #1a202c;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #718096;
      margin-bottom: 28px;
    }

    /* ── Converter card (Wise-style) ── */
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 20px 22px 22px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 32px;
    }

    /* Rate chip at the top */
    .rate-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eaf6ee;
      color: #14532d;
      font-weight: 700;
      font-size: .95rem;
      padding: 9px 16px;
      border-radius: 999px;
      margin: 0 auto 18px;
      width: fit-content;
    }
    .rate-chip .muted { color: #4d7c5a; font-weight: 600; }

    /* Money rows */
    .money-box {
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
    }
    .money-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      transition: background .15s;
    }
    .money-row:focus-within { background: #f7fafc; }
    .money-divider { height: 1.5px; background: #e2e8f0; }

    .money-side { flex: 1; min-width: 0; }
    .money-label { font-size: .82rem; color: #718096; margin-bottom: 8px; font-weight: 500; white-space: nowrap; }
    .money-side { flex: 0 0 auto; }
    .money-row .amount-input { flex: 1; }

    /* Currency pill / select */
    .ccy-pill {
      position: relative;
      display: inline-flex;
      align-items: center;
      background: #f1f5f9;
      border-radius: 999px;
      padding: 7px 12px;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
    }
    .ccy-pill .flag { font-size: 1.1rem; margin-right: 7px; }
    .ccy-pill .chev { margin-left: 6px; color: #94a3b8; font-size: .8rem; }
    .ccy-pill.fixed { background: #f1f5f9; cursor: default; }
    .ccy-pill select {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      border: none;
      font-size: 16px;
    }

    /* Big amount field */
    .amount-input {
      width: 100%;
      border: none;
      background: transparent;
      text-align: right;
      font-size: 2.1rem;
      font-weight: 800;
      color: #1a202c;
      outline: none;
      padding: 0;
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
    }
    .amount-input::placeholder { color: #cbd5e0; }
    .amount-input.readonly { color: #475569; }

    /* Swap button overlapping the divider */
    .swap-btn {
      position: absolute;
      left: 22px;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid #fff;
      background: #4299e1;
      color: #fff;
      font-size: 1.05rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      transition: background .15s, transform .15s;
      z-index: 2;
    }
    .swap-btn:hover { background: #3182ce; }
    .swap-btn:active { transform: translateY(-50%) scale(.92); }

    .rate-note {
      text-align: center;
      font-size: .78rem;
      color: #94a3b8;
      margin-top: 14px;
    }

    .error {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      background: #fff5f5;
      border: 1.5px solid #fed7d7;
      color: #c53030;
      font-size: .85rem;
      display: none;
    }
    .error.show { display: block; }

    /* ── Rate table ── */
    .table-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      width: 100%;
      max-width: 700px;
      overflow: hidden;
    }
    .table-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
    }
    .table-header h2 { font-size: 1rem; font-weight: 700; }
    .updated { font-size: .75rem; color: #a0aec0; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem;
    }
    thead th {
      background: #f7fafc;
      padding: 10px 16px;
      text-align: right;
      font-size: .75rem;
      font-weight: 700;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    thead th:first-child { text-align: left; }
    tbody tr { border-top: 1px solid #f0f4f8; transition: background .1s; }
    tbody tr:hover { background: #f7fafc; }
    td { padding: 10px 16px; text-align: right; }
    td:first-child { text-align: left; font-weight: 600; }
    .unit-badge {
      display: inline-block;
      font-size: .65rem;
      background: #e2e8f0;
      color: #4a5568;
      border-radius: 4px;
      padding: 1px 5px;
      margin-left: 4px;
      vertical-align: middle;
      font-weight: 600;
    }
    .na { color: #cbd5e0; }

    .loading {
      text-align: center;
      padding: 40px;
      color: #718096;
      font-size: .9rem;
    }
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid #e2e8f0;
      border-top-color: #4299e1;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<h1>🏦 HLB Forex Converter</h1>
<p class="subtitle">Live rates from Hong Leong Bank Malaysia</p>

<!-- Converter -->
<div class="card">
  <div class="rate-chip" id="rateChip">
    <span>Loading rate…</span>
  </div>

  <div class="money-box">
    <!-- Top row: you send -->
    <div class="money-row">
      <div class="money-side">
        <div class="money-label" id="topLabel">You send</div>
        <div class="ccy-pill" id="topPill">
          <span class="flag" id="topFlag">🇲🇾</span><span id="topCode">MYR</span>
          <select id="topSelect"></select>
          <span class="chev">▾</span>
        </div>
      </div>
      <input class="amount-input" id="topAmount" type="text" inputmode="decimal" value="1,000" />
    </div>

    <div class="money-divider"></div>

    <!-- Bottom row: recipient gets -->
    <div class="money-row">
      <button class="swap-btn" id="swapBtn" title="Swap direction">⇅</button>
      <div class="money-side">
        <div class="money-label" id="bottomLabel">Recipient gets</div>
        <div class="ccy-pill" id="bottomPill">
          <span class="flag" id="bottomFlag">🇨🇳</span><span id="bottomCode">CNY</span>
          <select id="bottomSelect"></select>
          <span class="chev">▾</span>
        </div>
      </div>
      <input class="amount-input" id="bottomAmount" type="text" inputmode="decimal" value="0.00" />
    </div>
  </div>

  <div class="rate-note" id="rateNote"></div>
  <div class="error" id="errorBox"></div>
</div>

<!-- Rate table -->
<div class="table-card">
  <div class="table-header">
    <h2>All Rates</h2>
    <span class="updated" id="updatedAt"></span>
  </div>
  <div id="tableWrap">
    <div class="loading"><span class="spinner"></span>Fetching live rates…</div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let rates = {};        // { CNY: { sell, buy, unit }, … }
let direction = 'sell'; // 'sell' = MYR → FX (send MYR);  'buy' = FX → MYR
let foreignCode = 'CNY';
let lastEdited = 'myr'; // which side the user last typed in: 'myr' | 'fx'

const FLAGS = {
  USD:'🇺🇸', EUR:'🇪🇺', GBP:'🇬🇧', AUD:'🇦🇺', CAD:'🇨🇦', SGD:'🇸🇬', CNY:'🇨🇳',
  HKD:'🇭🇰', JPY:'🇯🇵', THB:'🇹🇭', NZD:'🇳🇿', CHF:'🇨🇭', INR:'🇮🇳', KRW:'🇰🇷',
  IDR:'🇮🇩', PHP:'🇵🇭', VND:'🇻🇳', TWD:'🇹🇼', SAR:'🇸🇦', AED:'🇦🇪', BND:'🇧🇳',
  MYR:'🇲🇾',
};
const flag = c => FLAGS[c] || '🏳️';

// ── Fetch & parse ──────────────────────────────────────────────────────────
async function fetchRates() {
  const resp = await fetch('/api/rates');
  if (!resp.ok) throw new Error(`Server error ${resp.status}`);
  const json = await resp.json();
  if (json.error) throw new Error(json.error);
  return json.rates;
}

// ── Number helpers ───────────────────────────────────────────────────────────
function fmt(n, dp = 4) {
  return n == null ? '—' : n.toLocaleString('en-MY', { minimumFractionDigits: dp, maximumFractionDigits: dp });
}
const parseNum = s => parseFloat(String(s).replace(/,/g, '')) || 0;

function showError(msg) {
  document.getElementById('errorBox').textContent = msg;
  document.getElementById('errorBox').classList.add('show');
}
function clearError() { document.getElementById('errorBox').classList.remove('show'); }

// The rate that turns 1 unit of foreign into MYR for the active direction.
// MYR = FX * rate / unit  ⟺  FX = MYR * unit / rate
function activeRate(r) { return direction === 'sell' ? r.sell : r.buy; }

// ── Render which side is MYR vs foreign ──────────────────────────────────────
function syncSides() {
  const myrTop = direction === 'sell';            // send MYR → MYR on top
  const r = rates[foreignCode] || {};

  document.getElementById('topLabel').textContent    = 'You send';
  document.getElementById('bottomLabel').textContent = 'Recipient gets';

  // Decide code/flag per row
  const top    = myrTop ? 'MYR' : foreignCode;
  const bottom = myrTop ? foreignCode : 'MYR';
  document.getElementById('topCode').textContent    = top;
  document.getElementById('topFlag').textContent    = flag(top);
  document.getElementById('bottomCode').textContent = bottom;
  document.getElementById('bottomFlag').textContent = flag(bottom);

  // Only the foreign-currency pill carries the <select>; MYR pill is fixed.
  const topSel = document.getElementById('topSelect');
  const botSel = document.getElementById('bottomSelect');
  topSel.style.display = myrTop ? 'none' : 'block';
  botSel.style.display = myrTop ? 'block' : 'none';
  document.getElementById('topPill').classList.toggle('fixed', myrTop);
  document.getElementById('bottomPill').classList.toggle('fixed', !myrTop);

  // Rate chip + note
  const chip = document.getElementById('rateChip');
  const rate = activeRate(r);
  if (rate) {
    const perMyr = r.unit / rate; // foreign per 1 MYR
    chip.innerHTML = `<span>1 MYR = ${fmt(perMyr, 4)} ${foreignCode}</span>`;
    document.getElementById('rateNote').textContent =
      `Bank ${direction} rate · ${r.unit} ${foreignCode} = ${fmt(rate, 4)} MYR`;
  } else {
    chip.innerHTML = `<span>No ${direction} rate for ${foreignCode}</span>`;
    document.getElementById('rateNote').textContent = '';
  }
}

// ── Live recalculation ───────────────────────────────────────────────────────
function recalc() {
  clearError();
  const r = rates[foreignCode];
  if (!r) return;
  const rate = activeRate(r);

  const myrEl = direction === 'sell'
    ? document.getElementById('topAmount')
    : document.getElementById('bottomAmount');
  const fxEl = direction === 'sell'
    ? document.getElementById('bottomAmount')
    : document.getElementById('topAmount');

  if (!rate) { fxEl.value = '0.00'; return; }

  if (lastEdited === 'myr') {
    const myr = parseNum(myrEl.value);
    fxEl.value = fmt(myr * r.unit / rate, 2);
  } else {
    const fx = parseNum(fxEl.value);
    myrEl.value = fmt(fx * rate / r.unit, 2);
  }
}

function render() { syncSides(); recalc(); }

function buildTable() {
  const sorted = Object.entries(rates).sort((a, b) => a[0].localeCompare(b[0]));

  const html = `
    <table>
      <thead>
        <tr>
          <th>Currency</th>
          <th>Sell (MYR)</th>
          <th>Buy TT (MYR)</th>
        </tr>
      </thead>
      <tbody>
        ${sorted.map(([code, r]) => `
          <tr>
            <td>${code}<span class="unit-badge">per ${r.unit}</span></td>
            <td>${r.sell != null ? fmt(r.sell) : '<span class="na">—</span>'}</td>
            <td>${r.buy  != null ? fmt(r.buy)  : '<span class="na">—</span>'}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;

  document.getElementById('tableWrap').innerHTML = html;
}

function buildCurrencySelect() {
  const opts = Object.keys(rates).sort().map(c =>
    `<option value="${c}"${c === foreignCode ? ' selected' : ''}>${flag(c)} ${c}</option>`
  ).join('');
  document.getElementById('topSelect').innerHTML    = opts;
  document.getElementById('bottomSelect').innerHTML = opts;
}

// ── Event wiring ─────────────────────────────────────────────────────────────
function onPickCurrency(e) {
  foreignCode = e.target.value;
  document.getElementById('topSelect').value    = foreignCode;
  document.getElementById('bottomSelect').value = foreignCode;
  render();
}

function wireEvents() {
  document.getElementById('topSelect').addEventListener('change', onPickCurrency);
  document.getElementById('bottomSelect').addEventListener('change', onPickCurrency);

  document.getElementById('topAmount').addEventListener('input', () => {
    lastEdited = (direction === 'sell') ? 'myr' : 'fx';
    recalc();
  });
  document.getElementById('bottomAmount').addEventListener('input', () => {
    lastEdited = (direction === 'sell') ? 'fx' : 'myr';
    recalc();
  });

  document.getElementById('swapBtn').addEventListener('click', () => {
    direction = direction === 'sell' ? 'buy' : 'sell';
    render();
  });
}

// ── Init ───────────────────────────────────────────────────────────────────
(async () => {
  try {
    rates = await fetchRates();
    document.getElementById('updatedAt').textContent =
      'Updated ' + new Date().toLocaleTimeString('en-MY', { hour: '2-digit', minute: '2-digit' });
    if (!rates[foreignCode]) foreignCode = Object.keys(rates).sort()[0];
    buildCurrencySelect();
    wireEvents();
    render();
    buildTable();
  } catch (e) {
    document.getElementById('rateChip').innerHTML = '<span>Failed to load rates</span>';
    document.getElementById('tableWrap').innerHTML =
      `<div class="loading" style="color:#c53030">Failed to load rates. Please refresh.<br><small>${e.message}</small></div>`;
  }
})();
</script>
</body>
</html>
