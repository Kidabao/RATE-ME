<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HLB Forex Converter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
      color: #1a202c;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #718096;
      margin-bottom: 28px;
    }

    /* ── Converter card ── */
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 28px 28px 24px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 32px;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      align-items: flex-end;
    }

    label { display: block; font-size: .78rem; font-weight: 600; color: #4a5568; margin-bottom: 5px; }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      background: #f7fafc;
      transition: border-color .15s;
      outline: none;
    }
    input:focus, select:focus { border-color: #4299e1; background: #fff; }

    .field { flex: 1; }
    .field-sm { flex: 0 0 110px; }

    .dir-toggle {
      display: flex;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 18px;
    }
    .dir-toggle button {
      flex: 1;
      padding: 9px 0;
      border: none;
      background: #f7fafc;
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      color: #718096;
      transition: background .15s, color .15s;
    }
    .dir-toggle button.active {
      background: #4299e1;
      color: #fff;
    }

    .convert-btn {
      width: 100%;
      padding: 12px;
      background: #4299e1;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
    }
    .convert-btn:hover { background: #3182ce; }
    .convert-btn:disabled { background: #a0aec0; cursor: not-allowed; }

    .result {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 10px;
      background: #ebf8ff;
      border: 1.5px solid #bee3f8;
      display: none;
    }
    .result.show { display: block; }
    .result .amount { font-size: 1.5rem; font-weight: 700; color: #2b6cb0; }
    .result .note { font-size: .78rem; color: #4a5568; margin-top: 4px; }

    .error {
      margin-top: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      background: #fff5f5;
      border: 1.5px solid #fed7d7;
      color: #c53030;
      font-size: .85rem;
      display: none;
    }
    .error.show { display: block; }

    /* ── Rate table ── */
    .table-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      width: 100%;
      max-width: 700px;
      overflow: hidden;
    }
    .table-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
    }
    .table-header h2 { font-size: 1rem; font-weight: 700; }
    .updated { font-size: .75rem; color: #a0aec0; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem;
    }
    thead th {
      background: #f7fafc;
      padding: 10px 16px;
      text-align: right;
      font-size: .75rem;
      font-weight: 700;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    thead th:first-child { text-align: left; }
    tbody tr { border-top: 1px solid #f0f4f8; transition: background .1s; }
    tbody tr:hover { background: #f7fafc; }
    td { padding: 10px 16px; text-align: right; }
    td:first-child { text-align: left; font-weight: 600; }
    .unit-badge {
      display: inline-block;
      font-size: .65rem;
      background: #e2e8f0;
      color: #4a5568;
      border-radius: 4px;
      padding: 1px 5px;
      margin-left: 4px;
      vertical-align: middle;
      font-weight: 600;
    }
    .na { color: #cbd5e0; }

    .loading {
      text-align: center;
      padding: 40px;
      color: #718096;
      font-size: .9rem;
    }
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid #e2e8f0;
      border-top-color: #4299e1;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<h1>🏦 HLB Forex Converter</h1>
<p class="subtitle">Live rates from Hong Leong Bank Malaysia</p>

<!-- Converter -->
<div class="card">
  <div class="row">
    <div class="field">
      <label>Amount</label>
      <input type="number" id="amount" value="1000" min="0" step="any" />
    </div>
    <div class="field-sm">
      <label>Currency</label>
      <select id="currency"><option value="">Loading…</option></select>
    </div>
  </div>

  <div class="dir-toggle">
    <button id="btn-sell" class="active" onclick="setDir('sell')">MYR → FX&nbsp;&nbsp;(Send MYR)</button>
    <button id="btn-buy" onclick="setDir('buy')">FX → MYR&nbsp;&nbsp;(Receive MYR)</button>
  </div>

  <button class="convert-btn" id="convertBtn" onclick="doConvert()" disabled>Convert</button>

  <div class="result" id="result">
    <div class="amount" id="resultAmount"></div>
    <div class="note" id="resultNote"></div>
  </div>
  <div class="error" id="errorBox"></div>
</div>

<!-- Rate table -->
<div class="table-card">
  <div class="table-header">
    <h2>All Rates</h2>
    <span class="updated" id="updatedAt"></span>
  </div>
  <div id="tableWrap">
    <div class="loading"><span class="spinner"></span>Fetching live rates…</div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let rates = {};   // { CNY: { sell, buy, unit }, … }
let direction = 'sell';

// ── Fetch & parse ──────────────────────────────────────────────────────────
const HLB_URL = 'https://www.hlb.com.my/en/global-markets/forex-rates.html';
const PROXY   = 'https://api.allorigins.win/get?url=';

async function fetchRates() {
  const resp = await fetch(PROXY + encodeURIComponent(HLB_URL));
  if (!resp.ok) throw new Error('Proxy request failed');
  const json = await resp.json();
  return parseHTML(json.contents);
}

function extractNumber(text) {
  const m = text.match(/\d+\.\d+/g);
  return m ? parseFloat(m[m.length - 1]) : null;
}

function parseHTML(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const rows = doc.querySelectorAll('table.forex-rates-table tr');
  const result = {};
  let unit = 1;

  rows.forEach(row => {
    const cells = [...row.querySelectorAll('td, th')].map(c => c.innerText.trim());
    if (cells.length < 2) return;

    const label = cells[1] || '';
    if (label.includes('100 UNITS')) unit = 100;
    else if (label.includes('1 UNIT'))  unit = 1;

    const codeMatch = label.match(/\(([A-Z]{3})\)/);
    if (!codeMatch) return;
    const code = codeMatch[1];

    const sell = cells[2] ? extractNumber(cells[2]) : null;
    const buy  = cells[3] ? extractNumber(cells[3]) : null;
    result[code] = { sell, buy, unit };
  });

  return result;
}

// ── UI helpers ─────────────────────────────────────────────────────────────
function setDir(d) {
  direction = d;
  document.getElementById('btn-sell').classList.toggle('active', d === 'sell');
  document.getElementById('btn-buy').classList.toggle('active',  d === 'buy');
}

function fmt(n, dp = 4) {
  return n == null ? '—' : n.toLocaleString('en-MY', { minimumFractionDigits: dp, maximumFractionDigits: dp });
}

function showResult(amountLine, noteLine) {
  document.getElementById('resultAmount').textContent = amountLine;
  document.getElementById('resultNote').textContent   = noteLine;
  document.getElementById('result').classList.add('show');
  document.getElementById('errorBox').classList.remove('show');
}

function showError(msg) {
  document.getElementById('errorBox').textContent = msg;
  document.getElementById('errorBox').classList.add('show');
  document.getElementById('result').classList.remove('show');
}

function doConvert() {
  const amount = parseFloat(document.getElementById('amount').value);
  const code   = document.getElementById('currency').value;
  if (!code || isNaN(amount)) return showError('Please enter a valid amount.');

  const r = rates[code];
  if (!r) return showError(`No data for ${code}.`);

  if (direction === 'sell') {
    if (!r.sell) return showError(`No sell rate for ${code}.`);
    const received = amount * (r.unit / r.sell);
    showResult(
      `${fmt(amount, 2)} MYR → ${fmt(received)} ${code}`,
      `Rate: ${r.unit} ${code} = ${fmt(r.sell, 4)} MYR  (bank sell rate)`
    );
  } else {
    if (!r.buy) return showError(`No buy rate for ${code}.`);
    const received = amount * (r.buy / r.unit);
    showResult(
      `${fmt(amount, 2)} ${code} → ${fmt(received)} MYR`,
      `Rate: ${r.unit} ${code} = ${fmt(r.buy, 4)} MYR  (bank buy rate)`
    );
  }
}

function buildTable() {
  const sorted = Object.entries(rates).sort((a, b) => a[0].localeCompare(b[0]));

  const html = `
    <table>
      <thead>
        <tr>
          <th>Currency</th>
          <th>Sell (MYR)</th>
          <th>Buy TT (MYR)</th>
        </tr>
      </thead>
      <tbody>
        ${sorted.map(([code, r]) => `
          <tr>
            <td>${code}<span class="unit-badge">per ${r.unit}</span></td>
            <td>${r.sell != null ? fmt(r.sell) : '<span class="na">—</span>'}</td>
            <td>${r.buy  != null ? fmt(r.buy)  : '<span class="na">—</span>'}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;

  document.getElementById('tableWrap').innerHTML = html;
}

function buildCurrencySelect() {
  const sel = document.getElementById('currency');
  sel.innerHTML = Object.keys(rates).sort().map(c =>
    `<option value="${c}"${c === 'CNY' ? ' selected' : ''}>${c}</option>`
  ).join('');
  document.getElementById('convertBtn').disabled = false;
}

// ── Init ───────────────────────────────────────────────────────────────────
(async () => {
  try {
    rates = await fetchRates();
    document.getElementById('updatedAt').textContent =
      'Updated ' + new Date().toLocaleTimeString('en-MY', { hour: '2-digit', minute: '2-digit' });
    buildCurrencySelect();
    buildTable();
  } catch (e) {
    document.getElementById('tableWrap').innerHTML =
      `<div class="loading" style="color:#c53030">Failed to load rates. Please refresh.<br><small>${e.message}</small></div>`;
  }
})();
</script>
</body>
</html>
